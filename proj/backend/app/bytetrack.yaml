# ByteTrack settings (Ultralytics format). track_buffer is counted in *processed* frames
# (PROCESS_FPS is ~10/s, so 30 is roughly 3 seconds of memory for a lost track).
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 30
match_thresh: 0.8
fuse_score: True
